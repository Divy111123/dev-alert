<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ subject }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 24px; }
    .container { max-width: 680px; margin: 0 auto; background: #1e293b; border-radius: 8px; border: 1px solid #334155; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    .header { padding: 20px 24px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 20px; font-weight: 700; color: #38bdf8; text-decoration: none; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .badge-critical { background-color: #ef4444; color: #ffffff; }
    .badge-high { background-color: #f97316; color: #ffffff; }
    .badge-medium { background-color: #f59e0b; color: #ffffff; }
    .badge-low { background-color: #3b82f6; color: #ffffff; }
    .badge-resolved { background-color: #10b981; color: #ffffff; }
    .content { padding: 24px; }
    .title { font-size: 18px; font-weight: 600; color: #f8fafc; margin-top: 0; margin-bottom: 8px; }
    .meta-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
    .meta-table td { padding: 8px 12px; border-bottom: 1px solid #334155; }
    .meta-table td.label { width: 140px; color: #94a3b8; font-weight: 600; }
    .meta-table td.val { color: #f1f5f9; }
    .code-box { background: #0b1120; border: 1px solid #1e293b; border-radius: 6px; padding: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; line-height: 1.5; color: #f43f5e; overflow-x: auto; white-space: pre-wrap; margin: 16px 0; }
    .ai-box { background: #1e1b4b; border-left: 4px solid #818cf8; padding: 14px; border-radius: 4px; margin: 16px 0; font-size: 13px; color: #c7d2fe; }
    .btn { display: inline-block; background-color: #0284c7; color: #ffffff; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; font-size: 14px; margin-top: 16px; }
    .btn:hover { background-color: #0369a1; }
    .footer { padding: 16px 24px; background: #0f172a; border-top: 1px solid #334155; font-size: 12px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="logo">⚡ DevAlert</span>
      {% block badge %}{% endblock %}
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      This notification was automatically routed and dispatched by DevAlert.<br>
      To modify notification preferences, visit your DevAlert project settings.
    </div>
  </div>
</body>
</html>
